# Publishes the workspace packages this repository owns to npm, with provenance, through npm trusted
# publishing (OIDC): each package must list this repository and this workflow file as a trusted publisher
# on npmjs.com; no token secret is stored. A package is published when the version in its package.json
# is not on npm yet, so a release is a PR that bumps that version. This flow is deliberately separate from
# release-please, which versions the ayni-ui image.
name: Publish npm packages

on:
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - '.github/workflows/npm-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  core:
    name: '@ayni.org/ayni-ui-core'
    runs-on: ubuntu-latest
    env:
      PACKAGE_DIR: packages/core
      PACKAGE_NAME: '@ayni.org/ayni-ui-core'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js v24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'

      - name: Enable Corepack
        run: corepack enable

      - name: Update npm
        # OIDC publishing needs a recent npm
        run: npm install -g npm@latest

      - name: Decide whether this version is new
        id: version
        run: |
          VERSION=$(jq -r .version "$PACKAGE_DIR/package.json")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION is already on npm; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: pnpm --filter "$PACKAGE_NAME" build

      - name: Publish ${{ steps.version.outputs.version }}
        if: steps.version.outputs.publish == 'true'
        run: pnpm publish "./$PACKAGE_DIR" --access public --provenance --no-git-checks
