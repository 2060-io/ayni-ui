apiVersion: v2
name: ayni-ui-chart
# The chart is published next to the image on Docker Hub (io2060/ayni-ui-chart); a chart named like
# the image would overwrite the image tag with the chart artifact.
description: Helm chart for the Ayni UI
type: application
# version / appVersion are overwritten at publish time by the CD pipeline
# (helm package --version --app-version). These are just sane defaults.
version: 0.1.0
appVersion: "0.1.0"
